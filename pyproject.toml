[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "leanix-agent"
version = "1.0.1"
description = "Agent package for communicating with LeanIX Enterprise Architecture Management via REST APIs and GraphQL."
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.11, <3.15"
dependencies = [ "agent-utilities[mcp,owl]>=1.27.1,<2.0.0",]
license = "MIT"
license-files = ["LICENSE"]

[[project.authors]]
name = "Repository Maintainers"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp,owl]>=1.27.1,<2.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire]>=1.27.1,<2.0.0",]
gql = [ "gql>=4.0.0",]
all = [ "agent-utilities[mcp,agent-runtime,logfire,owl]>=1.27.1,<2.0.0", "gql>=4.0.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "gql[requests]>=4.0.0", "requests-toolbelt>=1.0.0" ]

[project.scripts]
leanix-mcp = "leanix_agent.mcp_server:mcp_server"
leanix-agent = "leanix_agent.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
leanix-agent = "leanix_agent.skills"

[project.entry-points."agent_utilities.prompt_providers"]
leanix-agent = "leanix_agent.prompts"

# CONCEPT:AU-KG.ontology.package-federation-migration — federate this package's OWL/RDF ontology module into the
# agent-utilities hub (fact sheets, applications, IT components). Resolved via
# iter_provider_dirs like the skill/prompt providers.
[project.entry-points."agent_utilities.ontology_providers"]
leanix-agent = "leanix_agent.ontology"

# CONCEPT:AU-KG.ingest.mcp-tool-connector — in-repo Tier-1 source presets so the
# package syncs its FactSheets into the KG declaratively via source_sync.
[project.entry-points."agent_utilities.source_connector_providers"]
leanix-agent = "leanix_agent.connectors"

[project.entry-points."agent_utilities.mcp_child_policies"]
leanix-official = "leanix_agent.official_mcp:create_official_mcp_child_policy"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
leanix_agent = [ "mcp_config.json", "agent_data/**", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = ["leanix_agent*"]
exclude = ["scripts*", "tests*"]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv.sources]
agent-utilities = { workspace = true }
