[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "leanix-agent"
version = "1.0.1"
description = "Agent package for communicating with LeanIX Enterprise Architecture Management via REST APIs and GraphQL."
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.11, <3.15"
dependencies = [ "agent-utilities[mcp]>=1.0.0",]
[[project.authors]]
name = "Audel Rouhi"
email = "knucklessg1@gmail.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp]>=1.0.0",]
agent = [ "agent-utilities[agent,logfire]>=1.0.0",]
gql = [ "gql>=4.0.0",]
all = [ "leanix-agent[mcp,agent,gql,logfire]>=1.0.0",]
test = [
    "pytest-xdist>=3.6.0", "pytest", "pytest-asyncio", "pytest-cov", "gql[requests]>=4.0.0", "requests-toolbelt>=1.0.0" ]

[project.scripts]
leanix-mcp = "leanix_agent.mcp_server:mcp_server"
leanix-agent = "leanix_agent.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
leanix-agent = "leanix_agent.skills"

[project.entry-points."agent_utilities.prompt_providers"]
leanix-agent = "leanix_agent.prompts"

# CONCEPT:AU-KG.ontology.package-federation-migration — federate this package's OWL/RDF ontology module into the
# agent-utilities hub (fact sheets, applications, IT components). Resolved via
# iter_provider_dirs like the skill/prompt providers.
[project.entry-points."agent_utilities.ontology_providers"]
leanix-agent = "leanix_agent.ontology"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
leanix_agent = [ "mcp_config.json", "agent_data/**", "skills/**", "prompts/**", "ontology/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]
